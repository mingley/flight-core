[package]
name = "flight-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Typed units, frames, vehicle typestate, and verified safety state machines for autonomous vehicles"
keywords = ["robotics", "px4", "uav", "typestate", "no-std"]
categories = ["science::robotics", "embedded", "no-std"]

[features]
default = ["std"]
std = ["serde"]
serde = ["dep:serde"]
# Official Creusot `#[requires]` / `#[ensures]` on the kernel. Dummy macros on
# rustc; `cargo creusot` discharges them. Optional: LGPL-2.1-or-later.
creusot = ["dep:creusot-contracts"]

[dependencies]
serde = { workspace = true, optional = true }
creusot-contracts = { version = "0.5.0", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(creusot)'] }

[dev-dependencies]
trybuild = { workspace = true }
tokio = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
